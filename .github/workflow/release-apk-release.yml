name: Build Release APK

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  release_apk:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Build Flutter APK
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform=android-arm64

      - name: Check APK exists
        run: |
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: apk_releases
          FILE_PATH: build/app/outputs/flutter-apk/app-release.apk
          REMOTE_NAME: cookbook.apk

        run: |
          curl -X POST "${{ env.SUPABASE_URL }}/storage/v1/object/${{ env.BUCKET }}/${{ env.REMOTE_NAME }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_KEY }}" \
            -H "x-upsert: true" \
            -F "file=@${{ env.FILE_PATH }};type=application/vnd.android.package-archive" \
            --fail